<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal — Login</title>
    <link rel="stylesheet" href="loginstyles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="login-wrapper">

        <!-- Left panel -->
        <div class="left-panel">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>EduPortal</h1>
                <p>Your gateway to knowledge and campus resources.</p>
            </div>
            <ul class="feature-list">
                <li><i class="fas fa-check-circle"></i> Access course materials</li>
                <li><i class="fas fa-check-circle"></i> View grades & attendance</li>
                <li><i class="fas fa-check-circle"></i> Connect with faculty</li>
                <li><i class="fas fa-check-circle"></i> Campus announcements</li>
            </ul>
        </div>

        <!-- Right panel — login form -->
        <div class="right-panel">
            <div class="login-card">

                <div class="card-header">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="Portal Logo" class="logo">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your college account</p>
                </div>

                <form class="login-form" novalidate>

                    <div class="input-group">
                        <label for="username">Username</label>
                        <div class="input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-pw" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-login">
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <div class="divider"><span>or</span></div>

                    <div class="register-prompt">
                        New to EduPortal? <a href="#">Create an account</a>
                    </div>

                </form>

            </div>
        </div>

    </div>

    <script>
        // Toggle password visibility
        document.querySelector('.toggle-pw').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        // Show toast message
        function showToast(msg, type = 'error') {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // Login form submit
        document.querySelector('.login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = this.querySelector('.btn-login');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    sessionStorage.setItem("username", data.username);
                    showToast('Welcome back, ' + data.username + '!', 'success');
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                } else {
                    showToast(data.message);
                }
            } catch {
                showToast('Network error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In</span><i class="fas fa-arrow-right"></i>';
            }
        });
    </script>

</body>
</html>
