<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPortal — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --accent: #06b6d4;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .nav-brand i {
            color: var(--accent);
            font-size: 22px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--muted);
        }

        .nav-user span {
            color: var(--text);
            font-weight: 600;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* ── Main ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            gap: 40px;
        }

        /* ── Welcome Card ── */
        .welcome-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 60%, #1e1b4b 100%);
            border-radius: 24px;
            padding: 52px 48px;
            text-align: center;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(79, 70, 229, 0.35);
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .welcome-card::after {
            content: '';
            position: absolute;
            bottom: -40px; left: -40px;
            width: 150px; height: 150px;
            background: rgba(6, 182, 212, 0.1);
            border-radius: 50%;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 20px;
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .welcome-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .welcome-card h1 span {
            color: var(--accent);
        }

        .welcome-card p {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
        }

        /* ── Quick Links ── */
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            max-width: 560px;
            width: 100%;
        }

        .quick-link {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: var(--text);
        }

        .quick-link:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.2);
        }

        .quick-link i {
            font-size: 26px;
            color: var(--accent);
            margin-bottom: 10px;
            display: block;
        }

        .quick-link span {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-brand">
            <i class="fas fa-graduation-cap"></i>
            EduPortal
        </div>
        <div class="nav-right">
            <div class="nav-user">
                <i class="fas fa-circle" style="color:#22c55e; font-size:8px;"></i>
                Logged in as <span id="nav-username">...</span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="welcome-card">
            <div class="avatar">🎓</div>
            <h1>Welcome back, <span id="welcome-name">...</span>!</h1>
            <p>You've successfully signed in to EduPortal.<br>Your campus resources are ready.</p>
            <div class="badge">
                <i class="fas fa-check-circle" style="color:#22c55e;"></i>
                Login successful
            </div>
        </div>

        <div class="quick-links">
            <a href="#" class="quick-link">
                <i class="fas fa-book-open"></i>
                <span>Courses</span>
            </a>
            <a href="#" class="quick-link">
                <i class="fas fa-chart-bar"></i>
                <span>Grades</span>
            </a>
            <a href="#" class="quick-link">
                <i class="fas fa-calendar-days"></i>
                <span>Schedule</span>
            </a>
            <a href="#" class="quick-link">
                <i class="fas fa-bell"></i>
                <span>Notices</span>
            </a>
        </div>
    </main>

    <script>
        // Get username from sessionStorage (set during login)
        const username = sessionStorage.getItem("username") || "User";
        document.getElementById("welcome-name").textContent = username;
        document.getElementById("nav-username").textContent = username;

        async function logout() {
            await fetch("/api/logout", { method: "POST" });
            sessionStorage.clear();
            window.location.href = "/";
        }
    </script>

</body>
</html>
